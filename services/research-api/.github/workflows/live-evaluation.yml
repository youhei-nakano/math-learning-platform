name: Live LLM evaluation

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Optional single case ID (blank runs the full set)
        required: false
      problem_count:
        description: Maximum number of cases (1-27)
        default: "1"
        required: true
      trials:
        description: Trials per case (production requires 5)
        default: "5"
        required: true
      timeout_seconds:
        description: API timeout per call
        default: "45"
        required: true
      max_cost_usd:
        description: Total API budget, at most USD 3.60
        default: "3.60"
        required: true

permissions:
  contents: read

jobs:
  evaluate:
    environment: live-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run explicitly authorized live evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CASE_ID: ${{ inputs.case_id }}
          PROBLEM_COUNT: ${{ inputs.problem_count }}
          TRIALS: ${{ inputs.trials }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          args=(--live --mode paired --output evaluation/runs/live.jsonl --limit "$PROBLEM_COUNT" --trials "$TRIALS" --timeout-seconds "$TIMEOUT_SECONDS" --max-total-cost-usd "$MAX_COST_USD")
          if [[ -n "$CASE_ID" ]]; then args+=(--case-id "$CASE_ID"); fi
          python evaluation/live_runner.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evaluation-jsonl
          path: evaluation/runs/live.jsonl
          if-no-files-found: warn
