[tool.ruff]
target-version = "py312"
line-length = 88
include = [
  "research_api.py",
  "research_platform/*.py",
  "evaluation/*.py",
  "evaluation/datasets/demo-v2/*.py",
  "tests/test_research_platform.py",
  "tests/test_live_evaluation.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"evaluation/*.py" = ["E402"]
