name: Live LLM evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Evaluation mode
        type: choice
        options: [live-single, live-multi]
        required: true
      case_id:
        description: Optional single case ID (blank runs the full set)
        required: false
      max_cost_usd:
        description: Total API budget, at most 5 USD
        default: "1.00"
        required: true

permissions:
  contents: read

jobs:
  evaluate:
    environment: live-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run explicitly authorized live evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODE: ${{ inputs.mode }}
          CASE_ID: ${{ inputs.case_id }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          args=(--live --mode "$MODE" --output evaluation/runs/live.jsonl --max-total-cost-usd "$MAX_COST_USD")
          if [[ -n "$CASE_ID" ]]; then args+=(--case-id "$CASE_ID"); fi
          python evaluation/live_runner.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evaluation-jsonl
          path: evaluation/runs/live.jsonl
          if-no-files-found: warn
