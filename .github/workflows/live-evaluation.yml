name: Live LLM evaluation

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Optional exact case ID
        required: false
      problem_count:
        description: Maximum cases, 1-27
        default: "1"
        required: true
      trials:
        description: Trials per case (production requires 5)
        default: "5"
        required: true
      timeout_seconds:
        default: "45"
        required: true
      max_cost_usd:
        description: Total API budget, at most USD 3.60
        default: "3.60"
        required: true

permissions:
  contents: read

concurrency:
  group: live-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    environment: live-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/research-api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run explicitly authorized evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CASE_ID: ${{ inputs.case_id }}
          PROBLEM_COUNT: ${{ inputs.problem_count }}
          TRIALS: ${{ inputs.trials }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          set -euo pipefail
          args=(--live --mode paired --output evaluation/runs/live.jsonl --limit "$PROBLEM_COUNT" --trials "$TRIALS" --timeout-seconds "$TIMEOUT_SECONDS" --max-total-cost-usd "$MAX_COST_USD")
          if [[ -n "$CASE_ID" ]]; then args+=(--case-id "$CASE_ID"); fi
          python evaluation/live_runner.py "${args[@]}"
      - name: Build sanitized aggregate
        if: always()
        run: |
          set -euo pipefail
          [[ -f evaluation/runs/live.jsonl ]] || touch evaluation/runs/live.jsonl
          python evaluation/report_live.py evaluation/runs/live.jsonl \
            --json evaluation/public/live-summary.json \
            --csv evaluation/public/live-summary.csv \
            --markdown evaluation/public/live-summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evaluation-summary
          path: services/research-api/evaluation/public/live-summary.*
          if-no-files-found: warn
          retention-days: 7
