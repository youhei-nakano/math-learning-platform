name: Bug report
description: Report a reproducible defect without sharing secrets or private documents.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private PDFs, personal data, or raw private traces."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic or CC0 data and list the smallest reproducible steps.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit SHA you tested.
  - type: textarea
    id: checks
    attributes:
      label: Checks and environment
      description: Relevant command results, OS, Python, and Node versions. Redact local paths and identifiers.
